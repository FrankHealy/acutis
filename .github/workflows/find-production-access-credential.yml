name: Find production access credential

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/find-production-access-credential.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  find:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check candidate names without exposing values
        env:
          GH_TOKEN: ${{ github.token }}
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          HCLOUD_API_TOKEN: ${{ secrets.HCLOUD_API_TOKEN }}
          HETZNER_TOKEN: ${{ secrets.HETZNER_TOKEN }}
          HETZNER_API_TOKEN: ${{ secrets.HETZNER_API_TOKEN }}
          HETZNER_CLOUD_TOKEN: ${{ secrets.HETZNER_CLOUD_TOKEN }}
          HETZNER_CLOUD_API_TOKEN: ${{ secrets.HETZNER_CLOUD_API_TOKEN }}
          CLOUD_TOKEN: ${{ secrets.CLOUD_TOKEN }}
          CLOUD_API_TOKEN: ${{ secrets.CLOUD_API_TOKEN }}
          SERVER_TOKEN: ${{ secrets.SERVER_TOKEN }}
          SERVER_API_TOKEN: ${{ secrets.SERVER_API_TOKEN }}
          ROOT_PASSWORD: ${{ secrets.ROOT_PASSWORD }}
          ROOT_PASS: ${{ secrets.ROOT_PASS }}
          ROOT_PWD: ${{ secrets.ROOT_PWD }}
          SERVER_ROOT_PASSWORD: ${{ secrets.SERVER_ROOT_PASSWORD }}
          VPS_ROOT_PASSWORD: ${{ secrets.VPS_ROOT_PASSWORD }}
          HETZNER_ROOT_PASSWORD: ${{ secrets.HETZNER_ROOT_PASSWORD }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_PASS: ${{ secrets.SSH_PASS }}
          PRODUCTION_SSH_PASSWORD: ${{ secrets.PRODUCTION_SSH_PASSWORD }}
          PROD_SSH_PASSWORD: ${{ secrets.PROD_SSH_PASSWORD }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PRIVATE_KEY: ${{ secrets.DEPLOY_PRIVATE_KEY }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_PRIVATE_KEY: ${{ secrets.PROD_PRIVATE_KEY }}
          PROD_KEY: ${{ secrets.PROD_KEY }}
          SERVER_SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_PRIVATE_KEY: ${{ secrets.SERVER_PRIVATE_KEY }}
          SERVER_KEY: ${{ secrets.SERVER_KEY }}
          ROOT_SSH_PRIVATE_KEY: ${{ secrets.ROOT_SSH_PRIVATE_KEY }}
          ROOT_SSH_KEY: ${{ secrets.ROOT_SSH_KEY }}
          ROOT_PRIVATE_KEY: ${{ secrets.ROOT_PRIVATE_KEY }}
          ROOT_KEY: ${{ secrets.ROOT_KEY }}
          HETZNER_SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          HETZNER_PRIVATE_KEY: ${{ secrets.HETZNER_PRIVATE_KEY }}
          HETZNER_KEY: ${{ secrets.HETZNER_KEY }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PRIVATE_KEY: ${{ secrets.VPS_PRIVATE_KEY }}
          VPS_KEY: ${{ secrets.VPS_KEY }}
          DOCKER_SSH_PRIVATE_KEY: ${{ secrets.DOCKER_SSH_PRIVATE_KEY }}
          DOCKER_SSH_KEY: ${{ secrets.DOCKER_SSH_KEY }}
          DOCKER_PRIVATE_KEY: ${{ secrets.DOCKER_PRIVATE_KEY }}
          DOCKER_KEY: ${{ secrets.DOCKER_KEY }}
          SALIENTWORKS_SSH_PRIVATE_KEY: ${{ secrets.SALIENTWORKS_SSH_PRIVATE_KEY }}
          SALIENTWORKS_SSH_KEY: ${{ secrets.SALIENTWORKS_SSH_KEY }}
          SALIENTWORKS_PRIVATE_KEY: ${{ secrets.SALIENTWORKS_PRIVATE_KEY }}
          SALIENTWORKS_KEY: ${{ secrets.SALIENTWORKS_KEY }}
          SW_SSH_PRIVATE_KEY: ${{ secrets.SW_SSH_PRIVATE_KEY }}
          SW_SSH_KEY: ${{ secrets.SW_SSH_KEY }}
          APP_SSH_PRIVATE_KEY: ${{ secrets.APP_SSH_PRIVATE_KEY }}
          APP_SSH_KEY: ${{ secrets.APP_SSH_KEY }}
          ADMIN_SSH_PRIVATE_KEY: ${{ secrets.ADMIN_SSH_PRIVATE_KEY }}
          ADMIN_SSH_KEY: ${{ secrets.ADMIN_SSH_KEY }}
          PRODUCTION_ROOT_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_ROOT_SSH_PRIVATE_KEY }}
          PRODUCTION_ROOT_SSH_KEY: ${{ secrets.PRODUCTION_ROOT_SSH_KEY }}
          PRODUCTION_DEPLOY_KEY: ${{ secrets.PRODUCTION_DEPLOY_KEY }}
          PRODUCTION_PRIVATE_KEY: ${{ secrets.PRODUCTION_PRIVATE_KEY }}
          KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
          KEYCLOAK_PASSWORD: ${{ secrets.KEYCLOAK_PASSWORD }}
          KC_ADMIN_PASSWORD: ${{ secrets.KC_ADMIN_PASSWORD }}
          KC_PASSWORD: ${{ secrets.KC_PASSWORD }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          MASTER_PASSWORD: ${{ secrets.MASTER_PASSWORD }}
          KEYCLOAK_MASTER_PASSWORD: ${{ secrets.KEYCLOAK_MASTER_PASSWORD }}
          KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD }}
          KC_BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.KC_BOOTSTRAP_ADMIN_PASSWORD }}
          PRODUCTION_SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          PRODUCTION_SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          PRODUCTION_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          PRODUCTION_SSH_HOST_KEY: ${{ secrets.PRODUCTION_SSH_HOST_KEY }}
        run: |
          set -e
          report="$RUNNER_TEMP/access-candidates.txt"
          echo "checked_at=$(date -u +%FT%TZ)" > "$report"
          while IFS='=' read -r name value; do
            case "$name" in
              GH_TOKEN|PATH|HOME|RUNNER_*|GITHUB_*|CI|PWD|OLDPWD|SHLVL|_) continue ;;
            esac
            [[ -n "$value" ]] && echo "$name=configured" >> "$report"
          done < <(env | sort)
          encoded=$(base64 -w0 "$report")
          path='ops/production-access-candidates.txt'
          sha=$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=main" --jq .sha 2>/dev/null || true)
          if [[ -n "$sha" ]]; then
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$path" -f message='Record configured production access candidates' -f content="$encoded" -f sha="$sha" -f branch=main >/dev/null
          else
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$path" -f message='Record configured production access candidates' -f content="$encoded" -f branch=main >/dev/null
          fi
          cat "$report"
