name: List production secret names

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/list-production-secret-names.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: Record secret metadata names only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          report="$RUNNER_TEMP/secret-names.txt"
          echo "checked_at=$(date -u +%FT%TZ)" > "$report"
          echo '=== REPOSITORY SECRETS ===' >> "$report"
          gh api "repos/$GITHUB_REPOSITORY/actions/secrets?per_page=100" --jq '.secrets[].name' >> "$report" 2>> "$report"
          echo "repo_secrets_rc=$?" >> "$report"
          echo '=== PRODUCTION ENVIRONMENT SECRETS ===' >> "$report"
          gh api "repos/$GITHUB_REPOSITORY/environments/production/secrets?per_page=100" --jq '.secrets[].name' >> "$report" 2>> "$report"
          echo "environment_secrets_rc=$?" >> "$report"
          echo '=== REPOSITORY VARIABLES ===' >> "$report"
          gh api "repos/$GITHUB_REPOSITORY/actions/variables?per_page=100" --jq '.variables[].name' >> "$report" 2>> "$report"
          echo "repo_variables_rc=$?" >> "$report"
          echo '=== PRODUCTION ENVIRONMENT VARIABLES ===' >> "$report"
          gh api "repos/$GITHUB_REPOSITORY/environments/production/variables?per_page=100" --jq '.variables[].name' >> "$report" 2>> "$report"
          echo "environment_variables_rc=$?" >> "$report"

          encoded=$(base64 -w0 "$report")
          path='ops/production-secret-names.txt'
          sha=$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=main" --jq .sha 2>/dev/null || true)
          if [[ -n "$sha" ]]; then
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$path" -f message='Record production secret names' -f content="$encoded" -f sha="$sha" -f branch=main >/dev/null
          else
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$path" -f message='Record production secret names' -f content="$encoded" -f branch=main >/dev/null
          fi
          cat "$report"
