name: Inspect live Salient Works frontend

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/inspect-live-salientworks-frontend.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Inspect deployed checkout
        env:
          GH_TOKEN: ${{ github.token }}
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          SSH_HOST_KEY: ${{ secrets.PRODUCTION_SSH_HOST_KEY }}
          HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          REMOTE_USER: ${{ secrets.PRODUCTION_SSH_USER }}
        run: |
          set +e
          report="$RUNNER_TEMP/live-frontend.txt"
          echo "checked_at=$(date -u +%FT%TZ)" > "$report"
          echo "inspection_revision=2" >> "$report"
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/key
          chmod 0600 ~/.ssh/key
          printf '%s\n' "$SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts
          ssh -o BatchMode=yes -i ~/.ssh/key "$REMOTE_USER@$HOST" 'bash -s' >> "$report" 2>&1 <<'REMOTE'
          set +e
          root=/opt/salientworks/glor/salientworks-ui-v6
          echo "host=$(hostname)"
          echo "identity=$(id)"
          echo 'root_permissions:'
          namei -l "$root" 2>&1 || true
          ls -ld "$root" "$root/.git" "$root/.next" "$root/src" "$root/src/app" 2>&1 || true
          echo 'git:'
          git -C "$root" remote -v 2>&1 || true
          git -C "$root" status --short --branch 2>&1 || true
          git -C "$root" rev-parse HEAD 2>&1 || true
          git -C "$root" log -8 --oneline --decorate 2>&1 || true
          echo 'package:'
          sed -n '1,240p' "$root/package.json" 2>&1 || true
          echo 'callback_matches:'
          grep -RInE --exclude-dir=node_modules --exclude-dir=.git --exclude='*.map' 'api/auth/callback|redirect_uri|redirectUri|openid-connect/auth|sw_oidc_state' "$root" 2>/dev/null | head -500 || true
          echo 'auth_files:'
          find "$root" -maxdepth 10 -type f \( -path '*api*auth*' -o -iname '*auth*' -o -iname '*keycloak*' -o -iname '*oidc*' \) 2>/dev/null | sort | head -400
          echo 'writability:'
          for path in "$root" "$root/.next" "$root/src" "$root/package.json"; do
            if [[ -w "$path" ]]; then echo "$path=writable"; else echo "$path=not_writable"; fi
          done
          REMOTE
          encoded=$(base64 -w0 "$report")
          path='ops/live-salientworks-frontend.txt'
          existing_sha=$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=main" --jq .sha 2>/dev/null || true)
          if [[ -n "$existing_sha" ]]; then
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$path" -f message='Record live Salient Works frontend' -f content="$encoded" -f sha="$existing_sha" -f branch=main >/dev/null
          else
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$path" -f message='Record live Salient Works frontend' -f content="$encoded" -f branch=main >/dev/null
          fi
          cat "$report"
