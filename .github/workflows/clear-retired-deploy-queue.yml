name: Clear retired Acutis deploy queue

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/clear-retired-deploy-queue.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  clear:
    runs-on: ubuntu-latest
    steps:
      - name: Clear retired deploys and dispatch Salient Works inspection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/cleared-runs.txt"
          echo "checked_at=$(date -u +%FT%TZ)" > "$report"
          echo "current_run=$GITHUB_RUN_ID" >> "$report"
          cancelled=0

          for status in queued in_progress waiting requested pending; do
            echo "=== status=$status ===" >> "$report"
            page=1
            while :; do
              response=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?status=$status&per_page=100&page=$page")
              count=$(python3 -c 'import json,sys; print(len(json.load(sys.stdin).get("workflow_runs", [])))' <<< "$response")
              [[ $count -eq 0 ]] && break

              while IFS=$'\t' read -r run_id name title event head_sha created_at; do
                [[ -z "$run_id" ]] && continue
                echo "run=$run_id name=$name title=$title event=$event sha=$head_sha created=$created_at" >> "$report"
                [[ "$run_id" == "$GITHUB_RUN_ID" ]] && continue
                if [[ "$name" == "Deploy Acutis production" || "$title" == *"Deploy Acutis production"* ]]; then
                  echo "cancelling_retired_deploy=$run_id" >> "$report"
                  gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel" >/dev/null 2>&1 || true
                  cancelled=$((cancelled+1))
                fi
              done < <(python3 - "$response" <<'PY'
          import json, sys
          for run in json.loads(sys.argv[1]).get('workflow_runs', []):
              vals = [
                  str(run.get('id','')),
                  str(run.get('name','')).replace('\t',' '),
                  str(run.get('display_title','')).replace('\t',' '),
                  str(run.get('event','')),
                  str(run.get('head_sha','')),
                  str(run.get('created_at','')),
              ]
              print('\t'.join(vals))
          PY
              )
              [[ $count -lt 100 ]] && break
              page=$((page+1))
            done
          done

          echo "cancelled=$cancelled" >> "$report"
          sleep 3
          gh workflow run inspect-live-salientworks-frontend.yml --ref main
          echo "dispatched=inspect-live-salientworks-frontend.yml" >> "$report"
          gh workflow run diagnose-salientworks-live.yml --ref main
          echo "dispatched=diagnose-salientworks-live.yml" >> "$report"

          encoded=$(base64 -w0 "$report")
          path='ops/cleared-retired-deploy-runs.txt'
          current_sha=$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=main" --jq .sha 2>/dev/null || true)
          if [[ -n "$current_sha" ]]; then
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$path" -f message='Record cleared queue and dispatched inspection' -f content="$encoded" -f sha="$current_sha" -f branch=main >/dev/null
          else
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$path" -f message='Record cleared queue and dispatched inspection' -f content="$encoded" -f branch=main >/dev/null
          fi
          cat "$report"
