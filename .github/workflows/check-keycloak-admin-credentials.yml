name: Check Keycloak administration credential names

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/check-keycloak-admin-credentials.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Record configured names only
        env:
          GH_TOKEN: ${{ github.token }}
          KC_BOOTSTRAP_ADMIN_USERNAME: ${{ secrets.KC_BOOTSTRAP_ADMIN_USERNAME }}
          KC_BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.KC_BOOTSTRAP_ADMIN_PASSWORD }}
          KEYCLOAK_ADMIN: ${{ secrets.KEYCLOAK_ADMIN }}
          KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
          KEYCLOAK_ADMIN_USERNAME: ${{ secrets.KEYCLOAK_ADMIN_USERNAME }}
          KEYCLOAK_MASTER_ADMIN: ${{ secrets.KEYCLOAK_MASTER_ADMIN }}
          KEYCLOAK_MASTER_PASSWORD: ${{ secrets.KEYCLOAK_MASTER_PASSWORD }}
          KC_ADMIN: ${{ secrets.KC_ADMIN }}
          KC_ADMIN_PASSWORD: ${{ secrets.KC_ADMIN_PASSWORD }}
          KEYCLOAK_ADMIN_CLIENT_ID: ${{ secrets.KEYCLOAK_ADMIN_CLIENT_ID }}
          KEYCLOAK_ADMIN_CLIENT_SECRET: ${{ secrets.KEYCLOAK_ADMIN_CLIENT_SECRET }}
        run: |
          set -e
          report="$RUNNER_TEMP/keycloak-admin-credentials.txt"
          echo "checked_at=$(date -u +%FT%TZ)" > "$report"
          for name in KC_BOOTSTRAP_ADMIN_USERNAME KC_BOOTSTRAP_ADMIN_PASSWORD KEYCLOAK_ADMIN KEYCLOAK_ADMIN_PASSWORD KEYCLOAK_ADMIN_USERNAME KEYCLOAK_MASTER_ADMIN KEYCLOAK_MASTER_PASSWORD KC_ADMIN KC_ADMIN_PASSWORD KEYCLOAK_ADMIN_CLIENT_ID KEYCLOAK_ADMIN_CLIENT_SECRET; do
            if [[ -n "${!name}" ]]; then echo "$name=configured"; else echo "$name=missing"; fi
          done >> "$report"
          encoded=$(base64 -w0 "$report")
          path='ops/keycloak-admin-credentials.txt'
          existing_sha=$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=main" --jq .sha 2>/dev/null || true)
          if [[ -n "$existing_sha" ]]; then
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$path" -f message='Record Keycloak admin credential names' -f content="$encoded" -f sha="$existing_sha" -f branch=main >/dev/null
          else
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$path" -f message='Record Keycloak admin credential names' -f content="$encoded" -f branch=main >/dev/null
          fi
