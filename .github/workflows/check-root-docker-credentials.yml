name: Check root and Docker credential names

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/check-root-docker-credentials.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Record configured names only
        env:
          GH_TOKEN: ${{ github.token }}
          ROOT_SSH_HOST: ${{ secrets.ROOT_SSH_HOST }}
          ROOT_SSH_USER: ${{ secrets.ROOT_SSH_USER }}
          ROOT_SSH_KEY: ${{ secrets.ROOT_SSH_KEY }}
          ROOT_SSH_PRIVATE_KEY: ${{ secrets.ROOT_SSH_PRIVATE_KEY }}
          SERVER_SSH_HOST: ${{ secrets.SERVER_SSH_HOST }}
          SERVER_SSH_USER: ${{ secrets.SERVER_SSH_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          HETZNER_SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          HETZNER_API_TOKEN: ${{ secrets.HETZNER_API_TOKEN }}
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          DOCKER_SSH_HOST: ${{ secrets.DOCKER_SSH_HOST }}
          DOCKER_SSH_USER: ${{ secrets.DOCKER_SSH_USER }}
          DOCKER_SSH_KEY: ${{ secrets.DOCKER_SSH_KEY }}
          DOCKER_SSH_PRIVATE_KEY: ${{ secrets.DOCKER_SSH_PRIVATE_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          SALIENTWORKS_HOST: ${{ secrets.SALIENTWORKS_HOST }}
          SALIENTWORKS_USER: ${{ secrets.SALIENTWORKS_USER }}
          SALIENTWORKS_SSH_KEY: ${{ secrets.SALIENTWORKS_SSH_KEY }}
          SALIENTWORKS_SSH_PRIVATE_KEY: ${{ secrets.SALIENTWORKS_SSH_PRIVATE_KEY }}
        run: |
          set -e
          report="$RUNNER_TEMP/root-docker-credentials.txt"
          echo "checked_at=$(date -u +%FT%TZ)" > "$report"
          for name in ROOT_SSH_HOST ROOT_SSH_USER ROOT_SSH_KEY ROOT_SSH_PRIVATE_KEY SERVER_SSH_HOST SERVER_SSH_USER SERVER_SSH_KEY SERVER_SSH_PRIVATE_KEY HETZNER_HOST HETZNER_USER HETZNER_SSH_KEY HETZNER_SSH_PRIVATE_KEY HETZNER_API_TOKEN HCLOUD_TOKEN DOCKER_SSH_HOST DOCKER_SSH_USER DOCKER_SSH_KEY DOCKER_SSH_PRIVATE_KEY DEPLOY_HOST DEPLOY_USER DEPLOY_KEY DEPLOY_SSH_KEY VPS_HOST VPS_USER VPS_SSH_KEY SSH_HOST SSH_USER SSH_KEY SSH_PRIVATE_KEY PROD_HOST PROD_USER PROD_SSH_KEY SALIENTWORKS_HOST SALIENTWORKS_USER SALIENTWORKS_SSH_KEY SALIENTWORKS_SSH_PRIVATE_KEY; do
            if [[ -n "${!name}" ]]; then echo "$name=configured"; else echo "$name=missing"; fi
          done >> "$report"
          encoded=$(base64 -w0 "$report")
          path='ops/root-docker-credentials.txt'
          existing_sha=$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=main" --jq .sha 2>/dev/null || true)
          if [[ -n "$existing_sha" ]]; then
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$path" -f message='Record root and Docker credential names' -f content="$encoded" -f sha="$existing_sha" -f branch=main >/dev/null
          else
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$path" -f message='Record root and Docker credential names' -f content="$encoded" -f branch=main >/dev/null
          fi
