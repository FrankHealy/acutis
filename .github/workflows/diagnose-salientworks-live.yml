name: Verify Salient Works Glor routing

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-salientworks-live.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Verify port 5092 and Nginx routes
        env:
          GH_TOKEN: ${{ github.token }}
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          SSH_HOST_KEY: ${{ secrets.PRODUCTION_SSH_HOST_KEY }}
          HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          USER: ${{ secrets.PRODUCTION_SSH_USER }}
        run: |
          set +e
          report="$RUNNER_TEMP/salientworks-live-diagnostic.txt"
          echo "checked_at=$(date -u +%FT%TZ)" > "$report"
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/key
          chmod 0600 ~/.ssh/key
          printf '%s\n' "$SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts

          ssh -o BatchMode=yes -i ~/.ssh/key "$USER@$HOST" 'bash -s' >> "$report" 2>&1 <<'REMOTE'
          set +e
          echo "host=$(hostname)"
          echo "identity=$(id)"
          echo
          echo '=== GLOR SERVICE ==='
          systemctl show salientworks-glor.service -p ActiveState -p SubState -p MainPID -p ExecStart -p EnvironmentFiles --no-pager 2>&1 || true
          echo
          check() {
            name=$1
            url=$2
            code=$(curl -k -sS --max-time 10 -o /tmp/body -w '%{http_code}' "$url" 2>/tmp/error)
            rc=$?
            echo "$name.rc=$rc"
            echo "$name.http=${code:-000}"
            if [[ -s /tmp/error ]]; then printf "$name.error="; tr '\n' ' ' < /tmp/error | head -c 500; echo; fi
            if [[ -s /tmp/body ]]; then printf "$name.body="; tr '\n' ' ' < /tmp/body | head -c 1500; echo; fi
          }
          echo '=== LOCAL GLOR ENDPOINTS ==='
          check glor_5092_root http://127.0.0.1:5092/
          check glor_5092_health http://127.0.0.1:5092/health
          check glor_5092_api_health http://127.0.0.1:5092/api/health
          check old_5091_api_health http://127.0.0.1:5091/api/health
          echo
          echo '=== NGINX ENGINE CONFIG ==='
          grep -RniE 'engine\.salientworks\.ie|5091|5092|salientworks-glor|proxy_pass' /etc/nginx/sites-enabled /etc/nginx/sites-available /etc/nginx/conf.d 2>/dev/null | head -400 || true
          echo
          echo '=== RELEVANT NGINX FILES ==='
          for file in $(grep -RilE 'engine\.salientworks\.ie|5091|5092' /etc/nginx/sites-enabled /etc/nginx/sites-available /etc/nginx/conf.d 2>/dev/null | sort -u); do
            echo "--- $file ---"
            sed -n '1,320p' "$file" 2>/dev/null || true
          done
          echo
          echo '=== PUBLIC ROUTES ==='
          check public_root https://engine.salientworks.ie/
          check public_api_health https://engine.salientworks.ie/api/health
          check public_health https://engine.salientworks.ie/health
          check public_domains https://engine.salientworks.ie/api/domains
          check public_auth_login https://engine.salientworks.ie/api/auth/login
          check public_keycloak_discovery https://engine.salientworks.ie/realms/salientworks/.well-known/openid-configuration
          REMOTE

          encoded=$(base64 -w0 "$report")
          path='ops/salientworks-live-diagnostic.txt'
          existing_sha=$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=main" --jq .sha 2>/dev/null || true)
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$path" -f message='Record Salient Works Glor routing verification' -f content="$encoded" -f sha="$existing_sha" -f branch=main >/dev/null
          cat "$report"
