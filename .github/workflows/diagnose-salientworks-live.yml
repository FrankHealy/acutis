name: Inspect approved Salient Works deployment command

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-salientworks-live.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Inspect approved deployers
        env:
          GH_TOKEN: ${{ github.token }}
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          SSH_HOST_KEY: ${{ secrets.PRODUCTION_SSH_HOST_KEY }}
          HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          USER: ${{ secrets.PRODUCTION_SSH_USER }}
        run: |
          set +e
          report="$RUNNER_TEMP/salientworks-deployer.txt"
          echo "checked_at=$(date -u +%FT%TZ)" > "$report"
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/key
          chmod 0600 ~/.ssh/key
          printf '%s\n' "$SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts
          ssh -o BatchMode=yes -i ~/.ssh/key "$USER@$HOST" 'bash -s' >> "$report" 2>&1 <<'REMOTE'
          set +e
          echo "host=$(hostname)"
          echo "identity=$(id)"
          echo '=== SUDO ==='
          sudo -n -l 2>&1 || true
          for script in /opt/acutis/bin/deploy-production-release /opt/acutis/bin/deploy-products-release; do
            echo "=== $script ==="
            stat "$script" 2>&1 || true
            file "$script" 2>&1 || true
            wc -l -c "$script" 2>&1 || true
            sed -n '1,500p' "$script" 2>&1 || true
          done
          echo '=== SALIENTWORKS DEPLOY ASSETS ==='
          find /opt/salientworks -maxdepth 4 -type f \( -iname '*deploy*' -o -iname '*release*' -o -iname '*restart*' \) -printf '%M %u:%g %p\n' 2>/dev/null | sort | head -300
          echo '=== SYSTEMD POLKIT ==='
          systemctl show salientworks-web.service -p UnitFileState -p CanStart -p CanStop -p CanReload --no-pager 2>&1 || true
          REMOTE
          encoded=$(base64 -w0 "$report")
          path='ops/salientworks-deployer.txt'
          sha=$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=main" --jq .sha 2>/dev/null || true)
          if [[ -n "$sha" ]]; then
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$path" -f message='Record approved product deployer' -f content="$encoded" -f sha="$sha" -f branch=main >/dev/null
          else
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$path" -f message='Record approved product deployer' -f content="$encoded" -f branch=main >/dev/null
          fi
          cat "$report"
