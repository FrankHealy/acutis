name: Verify Salient Works login flow

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-salientworks-live.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Follow production login flow
        env:
          GH_TOKEN: ${{ github.token }}
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          SSH_HOST_KEY: ${{ secrets.PRODUCTION_SSH_HOST_KEY }}
          HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          USER: ${{ secrets.PRODUCTION_SSH_USER }}
        run: |
          set +e
          report="$RUNNER_TEMP/salientworks-live-diagnostic.txt"
          echo "checked_at=$(date -u +%FT%TZ)" > "$report"
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/key
          chmod 0600 ~/.ssh/key
          printf '%s\n' "$SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts

          ssh -o BatchMode=yes -i ~/.ssh/key "$USER@$HOST" 'bash -s' >> "$report" 2>&1 <<'REMOTE'
          set +e
          echo "host=$(hostname)"
          echo "identity=$(id)"
          echo
          echo '=== LIVE SERVICES ==='
          systemctl is-active salientworks-web.service salientworks-glor.service nginx.service 2>&1 || true
          echo
          echo '=== GLOR ==='
          curl -sS --max-time 10 -o /tmp/domains -w 'local_domains.http=%{http_code}\n' http://127.0.0.1:5092/api/domains 2>&1 || true
          if [[ -s /tmp/domains ]]; then printf 'local_domains.body='; tr '\n' ' ' < /tmp/domains | head -c 1000; echo; fi
          echo
          echo '=== ROOT REDIRECT ==='
          curl -k -sS --max-time 15 -D /tmp/root-headers -o /tmp/root-body https://engine.salientworks.ie/
          echo "root.rc=$?"
          sed -n '1,40p' /tmp/root-headers
          if [[ -s /tmp/root-body ]]; then printf 'root.body='; tr '\n' ' ' < /tmp/root-body | head -c 1000; echo; fi
          echo
          echo '=== LOGIN REDIRECT ==='
          curl -k -sS --max-time 15 -D /tmp/login-headers -o /tmp/login-body 'https://engine.salientworks.ie/api/auth/login?returnTo=%2F'
          echo "login.rc=$?"
          sed -n '1,80p' /tmp/login-headers
          if [[ -s /tmp/login-body ]]; then printf 'login.body='; tr '\n' ' ' < /tmp/login-body | head -c 1200; echo; fi
          echo
          echo '=== FOLLOW LOGIN FLOW ==='
          curl -k -sS -L --max-redirs 8 --max-time 30 -D /tmp/follow-headers -o /tmp/follow-body -w 'follow.final_url=%{url_effective}\nfollow.http=%{http_code}\nfollow.redirects=%{num_redirects}\n' 'https://engine.salientworks.ie/api/auth/login?returnTo=%2F'
          echo "follow.rc=$?"
          grep -Ei '^(HTTP/|location:|set-cookie:)' /tmp/follow-headers | sed -E 's/(set-cookie:[^=]+=)[^;]+/\1[redacted]/I' | head -80
          if [[ -s /tmp/follow-body ]]; then
            printf 'follow.title='
            grep -io '<title>[^<]*' /tmp/follow-body | head -1 | sed 's/<title>//I'
            printf 'follow.body_sample='
            tr '\n' ' ' < /tmp/follow-body | head -c 1200
            echo
          fi
          echo
          echo '=== KEYCLOAK DISCOVERY ==='
          curl -k -sS --max-time 15 -o /tmp/discovery -w 'keycloak_discovery.http=%{http_code}\n' https://engine.salientworks.ie/realms/salientworks/.well-known/openid-configuration
          grep -o '"issuer":"[^"]*"' /tmp/discovery | head -1 || true
          grep -o '"authorization_endpoint":"[^"]*"' /tmp/discovery | head -1 || true
          REMOTE

          encoded=$(base64 -w0 "$report")
          path='ops/salientworks-live-diagnostic.txt'
          existing_sha=$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=main" --jq .sha 2>/dev/null || true)
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$path" -f message='Record Salient Works login verification' -f content="$encoded" -f sha="$existing_sha" -f branch=main >/dev/null
          cat "$report"
