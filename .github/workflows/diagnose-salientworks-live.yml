name: Inspect Salient Works Keycloak administration routes

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-salientworks-live.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - name: Inspect deployed administration source and endpoints
        env:
          GH_TOKEN: ${{ github.token }}
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          SSH_HOST_KEY: ${{ secrets.PRODUCTION_SSH_HOST_KEY }}
          HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          USER: ${{ secrets.PRODUCTION_SSH_USER }}
        run: |
          set +e
          report="$RUNNER_TEMP/keycloak-admin-routes.txt"
          echo "checked_at=$(date -u +%FT%TZ)" > "$report"
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/key
          chmod 0600 ~/.ssh/key
          printf '%s\n' "$SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts

          ssh -o BatchMode=yes -i ~/.ssh/key "$USER@$HOST" 'bash -s' >> "$report" 2>&1 <<'REMOTE'
          set +e
          root=/opt/salientworks/glor
          ui="$root/salientworks-ui-v6"
          echo "host=$(hostname)"
          echo "identity=$(id)"

          echo '=== KEYCLOAK ADMIN REFERENCES ==='
          grep -RInE --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=target --exclude='*.lock' \
            'KEYCLOAK_ADMIN_CLIENT|salientworks-administration|admin/realms|service[_-]?account|client_credentials|manage-users|view-users|KEYCLOAK_CLIENT_SECRET' \
            "$root" 2>/dev/null | head -600 || true

          echo '=== ADMIN/API ROUTE FILES ==='
          find "$ui/app" "$ui/src" -type f \( -path '*/api/*/route.*' -o -path '*/admin/*' \) 2>/dev/null | sort | head -600

          echo '=== ROUTE AUTHORIZATION REFERENCES ==='
          grep -RInE --exclude-dir=node_modules --exclude-dir=.next \
            'SESSION_COOKIE|require.*admin|studio_admin|administrator|roles|accessToken|Authorization|Bearer' \
            "$ui/app/api" "$ui/src" "$ui/lib" 2>/dev/null | head -800 || true

          echo '=== SELECTED KEYCLOAK FILES ==='
          while IFS= read -r file; do
            [[ -f "$file" ]] || continue
            echo "--- $file ---"
            sed -n '1,320p' "$file" 2>/dev/null || true
          done < <(grep -RIlE --exclude-dir=node_modules --exclude-dir=.next \
            'KEYCLOAK_ADMIN_CLIENT|salientworks-administration|admin/realms|client_credentials' \
            "$ui" 2>/dev/null | head -80)

          echo '=== LOCAL ENDPOINT PROBES ==='
          candidates=(
            /api/admin
            /api/admin/users
            /api/administration
            /api/administration/users
            /api/users
            /api/access
            /api/auth/session
            /api/auth/me
          )
          for path in "${candidates[@]}"; do
            code=$(curl -sS --max-time 8 -o /tmp/body -w '%{http_code}' "http://127.0.0.1:3011$path" 2>/tmp/error)
            rc=$?
            body=$(tr '\n' ' ' < /tmp/body 2>/dev/null | head -c 500)
            echo "path=$path rc=$rc http=${code:-000} body=$body"
          done
          REMOTE
          ssh_rc=$?
          echo "ssh_rc=$ssh_rc" >> "$report"

          encoded=$(base64 -w0 "$report")
          path='ops/keycloak-admin-routes.txt'
          sha=$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=main" --jq .sha 2>/dev/null || true)
          if [[ -n "$sha" ]]; then
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$path" -f message='Record Keycloak administration routes' -f content="$encoded" -f sha="$sha" -f branch=main >/dev/null
          else
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$path" -f message='Record Keycloak administration routes' -f content="$encoded" -f branch=main >/dev/null
          fi
          cat "$report"
