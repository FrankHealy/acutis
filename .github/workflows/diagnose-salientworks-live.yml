name: Inspect server-local Salient Works access

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-salientworks-live.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Inspect local SSH and Keycloak session paths
        env:
          GH_TOKEN: ${{ github.token }}
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          SSH_HOST_KEY: ${{ secrets.PRODUCTION_SSH_HOST_KEY }}
          HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          USER: ${{ secrets.PRODUCTION_SSH_USER }}
        run: |
          set +e
          report="$RUNNER_TEMP/server-local-access.txt"
          echo "checked_at=$(date -u +%FT%TZ)" > "$report"
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/key
          chmod 0600 ~/.ssh/key
          printf '%s\n' "$SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts
          ssh -o BatchMode=yes -i ~/.ssh/key "$USER@$HOST" 'bash -s' >> "$report" 2>&1 <<'REMOTE'
          set +e
          echo "host=$(hostname)"
          echo "identity=$(id)"
          echo '=== DEPLOY USER SSH FILES ==='
          find "$HOME/.ssh" -maxdepth 2 -printf '%M %u:%g %s %p\n' 2>/dev/null | sort || true
          if [[ -r "$HOME/.ssh/config" ]]; then
            echo '--- ssh config ---'
            sed -n -E '/^[[:space:]]*(Host|HostName|User|IdentityFile|ProxyJump|ProxyCommand)[[:space:]]/p' "$HOME/.ssh/config" | sed -E 's/(IdentityFile[[:space:]]+).*/\1[redacted-path]/I'
          fi
          echo '=== SSH AGENT ==='
          echo "SSH_AUTH_SOCK=${SSH_AUTH_SOCK:-none}"
          ssh-add -l 2>&1 || true
          echo '=== LOCAL SSH PROBES ==='
          for target in salientworks@127.0.0.1 salientworks@localhost root@127.0.0.1 root@localhost; do
            echo "--- $target ---"
            ssh -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=no "$target" 'id' 2>&1 || true
          done
          echo '=== OTHER HOME SSH DIRECTORIES ==='
          for dir in /home/salientworks/.ssh /root/.ssh; do
            echo "--- $dir ---"
            namei -l "$dir" 2>&1 || true
            find "$dir" -maxdepth 2 -printf '%M %u:%g %s %p\n' 2>/dev/null | sort || true
          done
          echo '=== KCADM CONFIG FILES ==='
          find /opt /home /root /etc -maxdepth 6 -type f \( -name 'kcadm.config' -o -name '*kcadm*config*' -o -path '*/.keycloak/*' \) -printf '%M %u:%g %s %p\n' 2>/dev/null | sort | head -300
          echo '=== READABLE KCADM CONFIG METADATA ==='
          while IFS= read -r file; do
            [[ -r "$file" ]] || continue
            echo "file=$file"
            sed -n -E 's/^[[:space:]]*"?([A-Za-z_][A-Za-z0-9_.-]*)"?[[:space:]]*[:=].*/key=\1/p' "$file" | sort -u | head -100
          done < <(find /opt /home /root /etc -maxdepth 6 -type f \( -name 'kcadm.config' -o -name '*kcadm*config*' -o -path '*/.keycloak/*' \) 2>/dev/null)
          echo '=== KEYCLOAK PROCESS CONTEXT ==='
          pid=$(pgrep -f 'io.quarkus.bootstrap.runner.QuarkusEntryPoint start' | head -1)
          echo "keycloak_pid=${pid:-none}"
          if [[ -n "$pid" ]]; then
            cat "/proc/$pid/cgroup" 2>&1 || true
            grep -E '^(Name|State|Uid|Gid|NSpid):' "/proc/$pid/status" 2>&1 || true
            ls -l "/proc/$pid/root" "/proc/$pid/cwd" 2>&1 || true
          fi
          REMOTE
          encoded=$(base64 -w0 "$report")
          path='ops/server-local-access.txt'
          sha=$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=main" --jq .sha 2>/dev/null || true)
          if [[ -n "$sha" ]]; then
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$path" -f message='Record server-local Salient Works access' -f content="$encoded" -f sha="$sha" -f branch=main >/dev/null
          else
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$path" -f message='Record server-local Salient Works access' -f content="$encoded" -f branch=main >/dev/null
          fi
          cat "$report"
