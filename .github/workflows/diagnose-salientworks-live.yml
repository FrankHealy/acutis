name: Extract Salient Works Keycloak error

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-salientworks-live.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Extract Keycloak error from login flow
        env:
          GH_TOKEN: ${{ github.token }}
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          SSH_HOST_KEY: ${{ secrets.PRODUCTION_SSH_HOST_KEY }}
          HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          USER: ${{ secrets.PRODUCTION_SSH_USER }}
        run: |
          set +e
          report="$RUNNER_TEMP/salientworks-live-diagnostic.txt"
          echo "checked_at=$(date -u +%FT%TZ)" > "$report"
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/key
          chmod 0600 ~/.ssh/key
          printf '%s\n' "$SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts

          ssh -o BatchMode=yes -i ~/.ssh/key "$USER@$HOST" 'bash -s' >> "$report" 2>&1 <<'REMOTE'
          set +e
          echo "host=$(hostname)"
          curl -k -sS -L --max-redirs 4 --max-time 30 -D /tmp/headers -o /tmp/body -w 'final_url=%{url_effective}\nhttp=%{http_code}\nredirects=%{num_redirects}\n' 'https://engine.salientworks.ie/api/auth/login?returnTo=%2F'
          echo "curl_rc=$?"
          echo 'locations:'
          grep -i '^location:' /tmp/headers | sed -E 's/(state=)[^& ]+/\1[redacted]/g; s/(code_challenge=)[^& ]+/\1[redacted]/g' || true
          echo 'keycloak_error_text:'
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class Text(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.parts=[]
              def handle_data(self, data):
                  s=' '.join(data.split())
                  if s:
                      self.parts.append(s)

          p=Text(); p.feed(Path('/tmp/body').read_text(errors='replace'))
          text=' | '.join(p.parts)
          for part in p.parts:
              low=part.lower()
              if any(k in low for k in ('invalid', 'error', 'redirect', 'client')):
                  print(part)
          print('all_text=' + text[:5000])
          PY
          echo 'status_checks:'
          curl -k -sS --max-time 10 -o /dev/null -w 'root=%{http_code}\n' https://engine.salientworks.ie/
          curl -k -sS --max-time 10 -o /dev/null -w 'domains=%{http_code}\n' https://engine.salientworks.ie/api/domains
          curl -k -sS --max-time 10 -o /dev/null -w 'discovery=%{http_code}\n' https://engine.salientworks.ie/realms/salientworks/.well-known/openid-configuration
          REMOTE

          encoded=$(base64 -w0 "$report")
          path='ops/salientworks-live-diagnostic.txt'
          existing_sha=$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=main" --jq .sha 2>/dev/null || true)
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$path" -f message='Record Salient Works Keycloak error' -f content="$encoded" -f sha="$existing_sha" -f branch=main >/dev/null
          cat "$report"
