name: Identify Salient Works runtime context

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-salientworks-live.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Inspect runtime process and Docker sockets
        env:
          GH_TOKEN: ${{ github.token }}
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          SSH_HOST_KEY: ${{ secrets.PRODUCTION_SSH_HOST_KEY }}
          HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          USER: ${{ secrets.PRODUCTION_SSH_USER }}
        run: |
          set +e
          report="$RUNNER_TEMP/salientworks-live-diagnostic.txt"
          echo "checked_at=$(date -u +%FT%TZ)" > "$report"
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/key
          chmod 0600 ~/.ssh/key
          printf '%s\n' "$SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts
          ssh -o BatchMode=yes -i ~/.ssh/key "$USER@$HOST" 'bash -s' >> "$report" 2>&1 <<'REMOTE'
          set +e
          echo "host=$(hostname)"
          echo "identity=$(id)"
          pid=$(pgrep -f '^/opt/salientworks/glor/rust/target/debug/salientworks-runtime$' | tail -1)
          echo "runtime_pid=${pid:-none}"
          if [[ -n "$pid" ]]; then
            echo 'runtime_cgroup:'
            cat "/proc/$pid/cgroup" 2>&1 || true
            echo 'runtime_namespaces:'
            ls -l "/proc/$pid/ns" 2>&1 || true
            echo 'runtime_root:'
            readlink "/proc/$pid/root" 2>&1 || true
            echo 'runtime_cwd:'
            readlink "/proc/$pid/cwd" 2>&1 || true
            echo 'runtime_status:'
            grep -E '^(Name|State|Uid|Gid|NSpid|Threads):' "/proc/$pid/status" 2>&1 || true
            echo 'runtime_fd_sockets:'
            ls -l "/proc/$pid/fd" 2>&1 | grep socket | head -30 || true
          fi
          echo 'docker_sockets:'
          find /run /var/run /home -maxdepth 5 -type s \( -name 'docker.sock' -o -name 'podman.sock' -o -name 'containerd.sock' \) -ls 2>/dev/null || true
          echo 'docker_contexts:'
          docker context ls 2>&1 || true
          echo 'container_services:'
          systemctl list-units --type=service --all --no-pager 2>/dev/null | grep -Ei 'docker|containerd|podman|salient' || true
          echo 'health:'
          curl -sS --max-time 5 -o /tmp/sw-health -w 'local_api.http=%{http_code}\n' http://127.0.0.1:5091/api/health 2>&1 || true
          REMOTE
          encoded=$(base64 -w0 "$report")
          path='ops/salientworks-live-diagnostic.txt'
          existing_sha=$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=main" --jq .sha 2>/dev/null || true)
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$path" -f message='Record Salient Works runtime context' -f content="$encoded" -f sha="$existing_sha" -f branch=main >/dev/null
          cat "$report"
