name: Identify live Salient Works source repository

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-salientworks-live.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Identify deployed source repository
        env:
          GH_TOKEN: ${{ github.token }}
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          SSH_HOST_KEY: ${{ secrets.PRODUCTION_SSH_HOST_KEY }}
          HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          USER: ${{ secrets.PRODUCTION_SSH_USER }}
        run: |
          set +e
          report="$RUNNER_TEMP/salientworks-source-repo.txt"
          echo "checked_at=$(date -u +%FT%TZ)" > "$report"
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/key
          chmod 0600 ~/.ssh/key
          printf '%s\n' "$SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts
          ssh -o BatchMode=yes -i ~/.ssh/key "$USER@$HOST" 'bash -s' >> "$report" 2>&1 <<'REMOTE'
          set +e
          root=/opt/salientworks/glor
          echo "host=$(hostname)"
          echo "identity=$(id)"
          echo '=== GIT ROOT ==='
          git -c safe.directory="$root" -C "$root" rev-parse --show-toplevel 2>&1 || true
          git -c safe.directory="$root" -C "$root" remote -v 2>&1 || true
          git -c safe.directory="$root" -C "$root" status --short --branch 2>&1 || true
          git -c safe.directory="$root" -C "$root" rev-parse HEAD 2>&1 || true
          git -c safe.directory="$root" -C "$root" branch -vv 2>&1 || true
          git -c safe.directory="$root" -C "$root" log -12 --oneline --decorate 2>&1 || true
          echo '=== TRACKED AUTH FILES ==='
          git -c safe.directory="$root" -C "$root" ls-files | grep -E 'salientworks-ui-v6/app/api/auth/(login|callback)/route\.ts$' || true
          echo '=== FILE COMMITS ==='
          git -c safe.directory="$root" -C "$root" log -8 --oneline -- salientworks-ui-v6/app/api/auth/login/route.ts salientworks-ui-v6/app/api/auth/callback/route.ts 2>&1 || true
          echo '=== SOURCE CONTENT ==='
          sed -n '1,180p' "$root/salientworks-ui-v6/app/api/auth/login/route.ts" 2>&1 || true
          echo '--- callback ---'
          sed -n '1,220p' "$root/salientworks-ui-v6/app/api/auth/callback/route.ts" 2>&1 || true
          echo '=== PARENT WRITABILITY ==='
          for p in "$root" "$root/.git" "$root/salientworks-ui-v6/app/api/auth/login/route.ts"; do
            [[ -w "$p" ]] && echo "$p=writable" || echo "$p=not_writable"
          done
          REMOTE
          encoded=$(base64 -w0 "$report")
          path='ops/salientworks-source-repo.txt'
          sha=$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=main" --jq .sha 2>/dev/null || true)
          if [[ -n "$sha" ]]; then
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$path" -f message='Record Salient Works source repository' -f content="$encoded" -f sha="$sha" -f branch=main >/dev/null
          else
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$path" -f message='Record Salient Works source repository' -f content="$encoded" -f branch=main >/dev/null
          fi
          cat "$report"
