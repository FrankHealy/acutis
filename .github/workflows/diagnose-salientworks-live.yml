name: Inspect live Keycloak JVM configuration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-salientworks-live.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - name: Inspect Keycloak JVM property names
        env:
          GH_TOKEN: ${{ github.token }}
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          SSH_HOST_KEY: ${{ secrets.PRODUCTION_SSH_HOST_KEY }}
          HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          USER: ${{ secrets.PRODUCTION_SSH_USER }}
        run: |
          set +e
          report="$RUNNER_TEMP/keycloak-jvm-config.txt"
          echo "checked_at=$(date -u +%FT%TZ)" > "$report"
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/key
          chmod 0600 ~/.ssh/key
          printf '%s\n' "$SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts
          ssh -o BatchMode=yes -i ~/.ssh/key "$USER@$HOST" 'bash -s' >> "$report" 2>&1 <<'REMOTE'
          set +e
          pid=$(pgrep -f 'io.quarkus.bootstrap.runner.QuarkusEntryPoint start' | head -1)
          echo "host=$(hostname)"
          echo "identity=$(id)"
          echo "keycloak_pid=${pid:-none}"
          echo 'java_tools:'
          for tool in jcmd jinfo jps java; do
            path=$(command -v "$tool" 2>/dev/null || true)
            echo "$tool=${path:-missing}"
          done
          if [[ -z "$pid" || -z $(command -v jcmd 2>/dev/null) ]]; then
            exit 50
          fi
          props=$(mktemp /tmp/keycloak-props.XXXXXX)
          chmod 600 "$props"
          timeout 25s jcmd "$pid" VM.system_properties > "$props" 2>/tmp/jcmd-error
          jcmd_rc=$?
          echo "jcmd_rc=$jcmd_rc"
          if [[ -s /tmp/jcmd-error ]]; then
            printf 'jcmd_error='
            tr '\n' ' ' < /tmp/jcmd-error | head -c 1000
            echo
          fi
          if [[ $jcmd_rc -eq 0 ]]; then
            echo 'candidate_property_names:'
            python3 - "$props" <<'PY'
          import re, sys
          names=[]
          with open(sys.argv[1], errors='replace') as handle:
              for line in handle:
                  if '=' not in line:
                      continue
                  name=line.split('=',1)[0].strip()
                  if re.search(r'(keycloak|kc\.|admin|password|credential|secret|token)', name, re.I):
                      names.append(name)
          for name in sorted(set(names)):
              print(name)
          PY
            echo 'all_property_name_count:'
            awk -F= 'NF>1{print $1}' "$props" | sort -u | wc -l
          fi
          rm -f "$props" /tmp/jcmd-error
          echo 'attach_socket_candidates:'
          find /tmp /proc/"$pid"/root/tmp -maxdepth 2 -type s -o -name '.java_pid*' 2>/dev/null | head -100 || true
          REMOTE
          encoded=$(base64 -w0 "$report")
          path='ops/keycloak-jvm-config.txt'
          sha=$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=main" --jq .sha 2>/dev/null || true)
          if [[ -n "$sha" ]]; then
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$path" -f message='Record Keycloak JVM configuration names' -f content="$encoded" -f sha="$sha" -f branch=main >/dev/null
          else
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$path" -f message='Record Keycloak JVM configuration names' -f content="$encoded" -f branch=main >/dev/null
          fi
          cat "$report"
