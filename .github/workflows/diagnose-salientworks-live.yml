name: Identify valid Salient Works Keycloak callback

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-salientworks-live.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Probe known callback variants
        env:
          GH_TOKEN: ${{ github.token }}
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          SSH_HOST_KEY: ${{ secrets.PRODUCTION_SSH_HOST_KEY }}
          HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          USER: ${{ secrets.PRODUCTION_SSH_USER }}
        run: |
          set +e
          report="$RUNNER_TEMP/salientworks-live-diagnostic.txt"
          echo "checked_at=$(date -u +%FT%TZ)" > "$report"
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/key
          chmod 0600 ~/.ssh/key
          printf '%s\n' "$SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts

          ssh -o BatchMode=yes -i ~/.ssh/key "$USER@$HOST" 'bash -s' >> "$report" 2>&1 <<'REMOTE'
          set +e
          echo "host=$(hostname)"
          auth='https://engine.salientworks.ie/realms/salientworks/protocol/openid-connect/auth'
          probe() {
            client=$1
            redirect=$2
            encoded=$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$redirect")
            url="$auth?client_id=$client&redirect_uri=$encoded&response_type=code&scope=openid&state=teststate&code_challenge=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA&code_challenge_method=S256"
            code=$(curl -k -sS --max-time 15 -o /tmp/body -w '%{http_code}' "$url")
            title=$(grep -io '<title>[^<]*' /tmp/body | head -1 | sed 's/<title>//I')
            error=$(python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class T(HTMLParser):
              def __init__(self): super().__init__(); self.p=[]
              def handle_data(self,d):
                  s=' '.join(d.split())
                  if s and ('invalid' in s.lower() or 'error' in s.lower()): self.p.append(s)
          p=T(); p.feed(Path('/tmp/body').read_text(errors='replace')); print(' | '.join(p.p)[:500])
          PY
          )
            echo "client=$client redirect=$redirect http=$code title=$title error=$error"
          }
          for client in salientworks-api salientworks-studio; do
            probe "$client" 'https://engine.salientworks.ie/api/auth/callback'
            probe "$client" 'https://engine.salientworks.ie/api/auth/callback/keycloak'
            probe "$client" 'https://salientworks.167-233-16-141.sslip.io/api/auth/callback'
            probe "$client" 'https://salientworks.167-233-16-141.sslip.io/api/auth/callback/keycloak'
            probe "$client" 'http://127.0.0.1:3011/api/auth/callback'
            probe "$client" 'http://localhost:3011/api/auth/callback/keycloak'
          done
          REMOTE

          encoded=$(base64 -w0 "$report")
          path='ops/salientworks-live-diagnostic.txt'
          existing_sha=$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=main" --jq .sha 2>/dev/null || true)
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$path" -f message='Record valid Keycloak callback probe' -f content="$encoded" -f sha="$existing_sha" -f branch=main >/dev/null
          cat "$report"
